<!DOCTYPE html>
<html>
<head>
    <title>Login - Bot Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center" style="min-height:100vh">
    <div class="card bg-secondary text-white p-4" style="width:360px">
        <h4 class="mb-4 text-center">📊 Bot Dashboard</h4>
        <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>📊 Dashboard Bot</h1>
    <a href="/logout" class="btn btn-outline-light btn-sm">Cerrar sesión</a>
</div>
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="usuario" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="contrasena" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
    </div>
</body>
</html>
