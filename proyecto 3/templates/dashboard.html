 <!DOCTYPE html>
<html>
<head>
    <div class="row mb-4">
    <div class="col">
        <div class="card bg-primary text-white p-3">
            <h4>Usuarios</h4>
            <h2>{{ total_usuarios }}</h2>
        </div>
    </div>
    <div class="col">
        <div class="card bg-success text-white p-3">
            <h4>Mensajes</h4>
            <h2>{{ total_mensajes }}</h2>
        </div>
    </div>
</div>
    <title>Dashboard Bot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<div class="container mt-4">
    <h1 class="mb-4">📊 Dashboard Bot</h1>

    <h3>👤 Usuarios</h3>
    <table class="table table-dark table-striped">
        <tr>
            <th>Teléfono</th>
            <th>Nombre</th>
        </tr>
        {% for u in usuarios %}
        <tr>
            <td>{{ u[0] }}</td>
            <td>{{ u[1] }}</td>
        </tr>
        {% endfor %}
    </table>

    <h3>💬 Mensajes</h3>
    <table class="table table-dark table-striped">
        <tr>
            <th>Teléfono</th>
            <th>Mensaje</th>
            <th>Fecha</th>
        </tr>
        {% for m in mensajes %}
        <tr>
            <td>{{ m[0] }}</td>
            <td>{{ m[1] }}</td>
            <td>{{ m[2] }}</td>
        </tr>
        {% endfor %}
    </table>
</div>

</body>
</html>
